name: privacy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  privacy:
    name: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan tracked repository paths
        run: python3 scripts/check_repository_privacy.py --tracked

      - name: Run privacy regression tests
        run: python3 -m unittest discover -s tests -p 'test_repository_privacy.py'
