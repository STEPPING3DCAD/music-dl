name: tidal-piping-watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - tidaldl-py/tidal_dl/api.py
      - tidaldl-py/tidal_dl/piping_watch.py
      - tidaldl-py/tidal_dl/piping_baseline.json
      - tidaldl-py/tests/test_piping_watch.py
      - .github/workflows/tidal-piping-watch.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: tidal-piping-watch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check bundled piping contract
        working-directory: tidaldl-py
        run: >-
          PYTHONNOUSERSITE=1 uv run --extra test python -m pytest
          tests/test_piping_watch.py -q

      - name: Watch gist and live piping
        id: watch
        if: github.event_name != 'pull_request'
        working-directory: tidaldl-py
        env:
          TIDAL_WATCH_ACCESS_TOKEN: ${{ secrets.TIDAL_WATCH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONNOUSERSITE=1 uv run python -m tidal_dl.piping_watch \
            --gist --live --json --report "$RUNNER_TEMP/tidal-piping.json"
          echo "report=$RUNNER_TEMP/tidal-piping.json" >> "$GITHUB_OUTPUT"

      - name: Open or update piping drift issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/tidal-piping.json
        run: |
          set -euo pipefail
          TITLE='[watch] Tidal piping drift'
          BODY_FILE="$RUNNER_TEMP/tidal-piping-issue.md"
          {
            echo "Weekly Tidal piping watch found drift."
            echo
            echo "Review \`tidaldl-py/tidal_dl/api.py\` and \`tidaldl-py/tidal_dl/piping_baseline.json\`, then ship the client change with the next binary."
            echo
            echo "Optional live probe uses repo secret \`TIDAL_WATCH_ACCESS_TOKEN\` from a Tidal Web login."
            echo
            echo '```json'
            if [[ -f "$REPORT_PATH" ]]; then
              cat "$REPORT_PATH"
            else
              echo '{"ok": false, "error": "watch report was not written"}'
            fi
            echo '```'
            echo
            echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY_FILE"
          existing="$(gh issue list --search "in:title $TITLE" --state open --json number,title \
            --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --label bug --body-file "$BODY_FILE"
          fi
